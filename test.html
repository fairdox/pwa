<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Tab Render - Bar 9 Color Exploded</title>
    <style>
        body {
            background: #1e1e1e;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        svg {
            border: 1px solid #444;
            background: #252526;
        }
        h3 {
            margin-top: 0;
            color: #ffffff;
        }
        .legend {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Visualizing Color-Coded Note Detections (Bar 9)</h3>
    <svg width="550" height="520" viewBox="-20 -20 540 100">


<path fill="#FF5733" stroke="none" d="M 25.35 23.92 c 0.2 -2.28 1.77 -2.95 3.4 -2.95 c 2 0 3.13 1.2 3.12 2.95 C 31.85 26.39 28.62 28.02 28.06 29.24 h 3.8 v 1.78 h -6.72 C 25.35 27.8 29.62 26.15 29.92 24.11 c 0.1 -0.8 -0.29 -1.5 -1.16 -1.56 c -1.2 -0.08 -1.47 0.86 -1.5 1.57 l -1.92 -0.2 Z" />

    </svg>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background:#FF5733"></div>Note 1 (Fret 2)</div>
        <div class="legend-item"><div class="color-box" style="background:#33FF57"></div>Note 2 (Fret 4)</div>
        <div class="legend-item"><div class="color-box" style="background:#3357FF"></div>Note 3 (Fret 4)</div>
        <div class="legend-item"><div class="color-box" style="background:#F3FF33"></div>Note 4 (Fret 4)</div>
        <div class="legend-item"><div class="color-box" style="background:#FF33F3"></div>Note 5 (Fret 4)</div>
        <div class="legend-item"><div class="color-box" style="background:#33FFF3"></div>Note 6 (Fret 6)</div>
        <div class="legend-item"><div class="color-box" style="background:#FFA533"></div>Note 7 (Fret 6)</div>
        <div class="legend-item"><div class="color-box" style="background:#AE33FF"></div>Note 8 (Fret 6)</div>
    </div>
</div>

</body>
</html>
